spring.application.name=makemytrip
server.port=8080
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/makemytrip}
spring.data.mongodb.database=makemytrip
travel.refund.within-hours=${REFUND_WITHIN_HOURS:24}
travel.refund.percentage=${REFUND_PERCENTAGE:50}
pricing.holiday-multiplier=${PRICING_HOLIDAY_MULTIPLIER:1.20}
pricing.demand-multiplier=${PRICING_DEMAND_MULTIPLIER:1.10}
pricing.availability-multiplier=${PRICING_AVAILABILITY_MULTIPLIER:1.15}
pricing.lead-time-multiplier=${PRICING_LEAD_TIME_MULTIPLIER:1.10}
pricing.demand-bookings-threshold=${PRICING_DEMAND_BOOKINGS_THRESHOLD:10}
pricing.low-inventory-threshold=${PRICING_LOW_INVENTORY_THRESHOLD:3}
pricing.freeze-minutes=${PRICING_FREEZE_MINUTES:15}
flight-status.simulation-enabled=${FLIGHT_STATUS_SIMULATION_ENABLED:true}
flight-status.simulation-interval-seconds=${FLIGHT_STATUS_SIMULATION_INTERVAL_SECONDS:60}
paytm.mid=${PAYTM_MID:}
paytm.merchant-key=${PAYTM_MERCHANT_KEY:}
paytm.pos-id=${PAYTM_POS_ID:}
paytm.qr-url=${PAYTM_QR_URL:https://securegw.paytm.in/paymentservices/qr/create}
paytm.status-url=${PAYTM_STATUS_URL:https://securegw.paytm.in/v3/order/status}
paytm.status-poll-interval-ms=${PAYTM_STATUS_POLL_INTERVAL_MS:30000}
admin.signup.tokens=${ADMIN_SIGNUP_TOKENS:}
